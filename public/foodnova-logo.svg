<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Definitions for glowing atomic core -->
  <defs>
    <radialGradient id="bulbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#42DFA8" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#42DFA8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#211747" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" rx="100" fill="#211747" />

  <g id="foodnova-symbol">
    <!-- Glowing backdrop behind bulb -->
    <ellipse cx="250" cy="175" rx="85" ry="95" fill="url(#bulbGlow)" />

    <!-- Atomic Orbits (3 intersecting elliptical rings) -->
    <ellipse cx="250" cy="175" rx="175" ry="64" fill="none" stroke="#42DFA8" stroke-width="4.5" transform="rotate(-15 250 175)" />
    <ellipse cx="250" cy="175" rx="175" ry="64" fill="none" stroke="#42DFA8" stroke-width="4.5" transform="rotate(45 250 175)" />
    <ellipse cx="250" cy="175" rx="175" ry="64" fill="none" stroke="#42DFA8" stroke-width="4.5" transform="rotate(105 250 175)" />

    <!-- Atomic Orbit Electrons / Nodes -->
    <circle cx="260" cy="40" r="8.5" fill="#42DFA8" />
    <circle cx="240" cy="310" r="8.5" fill="#42DFA8" />
    <circle cx="110" cy="120" r="8.5" fill="#42DFA8" />
    <circle cx="390" cy="230" r="8.5" fill="#42DFA8" />
    <circle cx="95" cy="200" r="8.5" fill="#42DFA8" />
    <circle cx="405" cy="150" r="8.5" fill="#42DFA8" />

    <!-- Central Scientific Lightbulb Outline -->
    <path d="M200 160 C200 120, 222 98, 250 98 C278 98, 300 120, 300 160 C300 182, 286 200, 276 214 L276 228 C276 232, 272 235, 268 235 L232 235 C228 235, 224 232, 224 228 L224 214 C214 200, 200 182, 200 160 Z" 
          fill="#42DFA8" stroke="#42DFA8" stroke-width="3" stroke-linejoin="round" />

    <!-- Bulb Screw Base Rings -->
    <path d="M226 243 L274 243" stroke="#42DFA8" stroke-width="5.5" stroke-linecap="round" />
    <path d="M230 253 L270 253" stroke="#42DFA8" stroke-width="5.5" stroke-linecap="round" />
    <path d="M238 262 C238 266, 262 266, 262 262" stroke="#42DFA8" stroke-width="5.5" stroke-linecap="round" fill="none" />

    <!-- Inner Core Cutout (Deep Navy): Leaf + Fork & Spoon -->
    <circle cx="250" cy="162" r="36" fill="#211747" />

    <!-- Sprouting Leaf arching from left around top -->
    <path d="M230 174 C228 146, 241 130, 266 133 C262 140, 257 145, 246 146 C241 153, 236 164, 234 174 Z" fill="#42DFA8" />
    <path d="M255 134 C264 129, 271 131, 273 137 C267 141, 261 140, 255 134 Z" fill="#42DFA8" />

    <!-- Cutlery: Fork & Spoon inside inner disc -->
    <!-- Fork (Left) -->
    <path d="M243 170 L243 186" stroke="#42DFA8" stroke-width="2" stroke-linecap="round" />
    <path d="M239 160 L239 166 C239 169, 247 169, 247 166 L247 160" fill="none" stroke="#42DFA8" stroke-width="1.8" stroke-linecap="round" />
    <line x1="243" y1="160" x2="243" y2="167" stroke="#42DFA8" stroke-width="1.8" stroke-linecap="round" />

    <!-- Spoon (Right) -->
    <path d="M257 170 L257 186" stroke="#42DFA8" stroke-width="2" stroke-linecap="round" />
    <ellipse cx="257" cy="163" rx="4" ry="5.5" fill="#42DFA8" />
  </g>

  <!-- Wordmark -->
  <text x="250" y="380" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="52" font-weight="800" fill="#42DFA8" letter-spacing="4" text-anchor="middle">FOODNOVA</text>
  <text x="250" y="425" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="28" font-weight="500" fill="#42DFA8" letter-spacing="8" text-anchor="middle">CONSULTING</text>
</svg>
